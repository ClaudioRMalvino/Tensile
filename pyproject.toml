[project]
name = "tensile"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.12"
pybind11 = ">=3.0"
pytest = ">=8"
cmake = ">=3.20"
doxygen = "*"
graphviz = "*"

[tool.pixi.tasks]
configure_debug = "cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug"
configure_release = "cmake -S . -B build-release- -DCMAKE_BUILD_TYPE=Release -DTENSILE_BUILD_TESTS=OFF"
configure_release_bench = "cmake -S . -B build-release-bench -DCMAKE_BUILD_TYPE=Release -DTENSILE_BUILD_TESTS=OFF"
build_debug = { cmd = "cmake --build build-debug", depends-on = ["configure_debug"] }
build_benchmark = { cmd = "cmake --build build-release-bench --target tensile_benchmarks", depends-on = ["configure_release_bench"] }
test = { cmd = "ctest --test-dir build-debug --output-on-failure", depends-on = ["build_debug"] }
bench = { cmd = "./build-release-bench/benchmarks/tensile_benchmarks", depends-on = ["build_benchmark"] }
docs = "doxygen Doxyfile"
